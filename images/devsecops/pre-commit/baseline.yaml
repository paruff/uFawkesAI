# Offline pre-commit baseline for repos that use the uFawkes DevSecOps image.
#
# Every hook calls a tool preinstalled in the image (`language: system`), so
# pre-commit never downloads a hook environment: runs are fast, work with no
# network, and use exactly the versions pinned in the image.
#
# Adopt: copy to your repo as .pre-commit-config.yaml, then add repo-specific
# `exclude:` patterns and local hooks. Outside the image these hooks need the
# same tools on PATH.
---
repos:
  - repo: local
    hooks:
      # ── hygiene (pre-commit-hooks) ────────────────────────────────────
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: fix end of files
        entry: end-of-file-fixer
        language: system
        types: [text]
      - id: mixed-line-ending
        name: mixed line ending
        entry: mixed-line-ending
        args: ["--fix=lf"]
        language: system
        types: [text]
      - id: check-merge-conflict
        name: check for merge conflicts
        entry: check-merge-conflict
        language: system
        types: [text]
      - id: check-added-large-files
        name: check for added large files
        entry: check-added-large-files
        args: ["--maxkb=1024"]
        language: system
      - id: check-yaml
        name: check yaml
        entry: check-yaml
        args: ["--allow-multiple-documents"]
        language: system
        types: [yaml]
      - id: check-json
        name: check json
        entry: check-json
        language: system
        types: [json]

      # ── linters ───────────────────────────────────────────────────────
      - id: ruff
        name: ruff
        entry: ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: hadolint
        name: hadolint
        entry: hadolint
        language: system
        types: [dockerfile]
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: yamllint
        name: yamllint
        entry: yamllint
        language: system
        types: [yaml]
      - id: markdownlint
        name: markdownlint
        entry: markdownlint-cli2 --fix
        language: system
        types: [markdown]

      # ── secrets ───────────────────────────────────────────────────────
      - id: detect-private-key
        name: detect private key
        entry: detect-private-key
        language: system
        types: [text]
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false
      # With a baseline file: detect-secrets-hook --baseline .secrets.baseline
      - id: detect-secrets
        name: detect secrets
        entry: detect-secrets-hook
        language: system
        types: [text]
