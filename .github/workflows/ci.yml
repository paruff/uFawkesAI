name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Opt into Node 24 runner now — Node 20 forced removal September 16 2026.
# Remove this block once Node 24 becomes the GitHub Actions default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Stage 0: Pre-flight Checks
  # ════════════════════════════════════════════════════════════════════════════
  preflight:
    name: "✈️ Pre-flight"
    uses: paruff/ufawkespipe/.github/workflows/reusable-preflight.yml@v1.2.0
    with:
      pr-size-limit: 400
      commit-format: conventional
      emergency-bypass: true

  # ════════════════════════════════════════════════════════════════════════════
  # Stage 1: Static Analysis
  # ════════════════════════════════════════════════════════════════════════════
  lint:
    name: "🔍 Lint"
    uses: paruff/ufawkespipe/.github/workflows/reusable-lint.yml@v1.2.0
    with:
      auto-detect: true
      emergency-bypass: true

  # ════════════════════════════════════════════════════════════════════════════
  # Pipeline Summary
  # ════════════════════════════════════════════════════════════════════════════
  pipeline-summary:
    name: "✅ Pipeline Complete"
    needs: [preflight, lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: job-start
        run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - name: Check all stages
        run: |
          if [ "${{ needs.preflight.result }}" == "failure" ] || \
             [ "${{ needs.lint.result }}" == "failure" ]; then
            echo "❌ One or more CI stages failed"
            exit 1
          fi
          echo "✅ All CI stages passed — ready for review"

      - name: Generate pipeline summary
        if: always()
        run: |
          echo "## Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-flight | ${{ needs.preflight.result == 'success' && '✅ Pass' || (needs.preflight.result == 'skipped' && '⏭️ Skipped' || '❌ Fail') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result == 'success' && '✅ Pass' || (needs.lint.result == 'skipped' && '⏭️ Skipped' || '❌ Fail') }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### DORA Metrics" >> $GITHUB_STEP_SUMMARY
          echo "- **Pre-flight time**: ~1 min" >> $GITHUB_STEP_SUMMARY
           echo "- **Lint time**: ~3 min" >> $GITHUB_STEP_SUMMARY
           echo "- **Total time**: ~4 min" >> $GITHUB_STEP_SUMMARY
      - name: job-finish
        run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
