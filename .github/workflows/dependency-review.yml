name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: "📦 Dependency Review"
    runs-on: ubuntu-latest
    steps:
      - name: job-start
        run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check dependency graph availability
        id: dependency-graph
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              const response = await github.request('GET /repos/{owner}/{repo}/dependency-graph/sbom', {
                owner: context.repo.owner,
                repo: context.repo.repo,
              });

              core.setOutput('enabled', 'true');
              console.log(`✅ Dependency graph is available (HTTP ${response.status})`);
            } catch (error) {
              const rawStatus = error.status;
              const status = Number.isFinite(Number(rawStatus)) ? Number(rawStatus) : null;
              const apiMessage = error.response?.data?.message;
              const runtimeMessage = error.message;
              const message = apiMessage ?? runtimeMessage ?? 'No error message provided.';

              if (status === 403 || status === 404) {
                core.warning(
                  `Dependency graph is not enabled for ${context.repo.owner}/${context.repo.repo}; skipping dependency review (status: ${status}, message: ${message}).`
                );
                core.setOutput('enabled', 'false');
                return;
              }

              throw error;
            }
      - name: Review dependencies
        if: steps.dependency-graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: job-finish
        run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
