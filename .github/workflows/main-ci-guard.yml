name: Main CI Guard

# Blocks PR merges to main while main's CI Quality Gate has not passed.
# The logic is uFawkesPipe's reusable guard (PI-8); judge-head and the
# fallback to the `✅ CI Complete` check run are its opt-in inputs.

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  main-ci-guard:
    name: "🛡️ Main CI Guard"
    # shortcut: pinned to Pipe main @ #274 (0e472e2), untagged; move to the tag once Pipe cuts it.
    uses: paruff/uFawkesPipe/.github/workflows/reusable-main-ci-guard.yml@0e472e20518b397fe73714c6c0e058f5b475803f
    with:
      workflow-id: ci-quality.yml
      workflow-name: "CI Quality Gate"
      judge-head: true
      fallback-check-name: "✅ CI Complete"
