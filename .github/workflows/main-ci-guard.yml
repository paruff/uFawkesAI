name: Main CI Guard

# Blocks PR merges to main until the main CI workflow passes.
# This is the primary merge gate — no PR can land on main without
# successful completion of the referenced CI workflow.

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  main-ci-guard:
    name: "🛡️ Main CI Guard"
    uses: ./.github/workflows/reusable-main-ci-guard.yml
    with:
      workflow-id: ci-quality.yml
