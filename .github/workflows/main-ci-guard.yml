name: Main CI Guard

# Blocks PR merges to main until the primary CI workflow has a successful run.

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  main-ci-guard:
    name: "🛡️ Main CI Guard"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: job-start
        run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Check latest CI Quality Gate run on main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci-quality.yml',
              branch: 'main',
              status: 'completed',
              per_page: 1,
            });

            if (runs.workflow_runs.length === 0) {
              core.setFailed('No completed CI Quality Gate runs found on main');
              return;
            }

            const latest = runs.workflow_runs[0];
            core.info(`Latest main CI run: ${latest.html_url}`);
            core.info(`Conclusion: ${latest.conclusion}`);

            if (latest.conclusion !== 'success') {
              core.setFailed(
                `CI Quality Gate on main is ${latest.conclusion}. ` +
                  `Fix main CI before merging PRs. ${latest.html_url}`,
              );
            }

      - name: job-finish
        if: always()
        run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
