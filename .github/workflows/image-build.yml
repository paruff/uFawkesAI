name: DevSecOps Image — Build & Verify

# Builds the uFawkes DevSecOps toolchain images — core, gitops, ai
# (docs/ai-sdlc/devsecops-image/) — natively on amd64 and arm64, then proves
# each inside itself with no network: locked versions, gate accept/reject
# fixtures, offline pre-commit. A second no-cache build must report an
# identical toolchain (determinism).
# Also runs weekly (schedule) and scans for CVEs. No push here — publishing,
# signing and attestation are image-release.yml, on image-vX.Y.Z tags only.

on:
  pull_request:
    paths:
      - "images/devsecops/**"
      - "scripts/image-lock-refresh.sh"
      - ".github/workflows/image-build.yml"
  push:
    branches: [main]
    paths:
      - "images/devsecops/**"
      - "scripts/image-lock-refresh.sh"
      - ".github/workflows/image-build.yml"
  schedule:
    - cron: "17 6 * * 1" # Mondays: re-verify the locked toolchain, rescan for new CVEs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: "🐳 core + gitops + ai (${{ matrix.arch }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: job-start
        run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build all variants
        working-directory: images/devsecops
        run: TAG=ci docker buildx bake --load

      - name: Verify each variant (network disabled)
        run: |
          for v in core gitops ai; do
            docker run --rm --network none \
              -v "$PWD/images/devsecops/tests:/tests:ro" \
              "ufawkes-devsecops-$v:ci" /tests/verify-tools.sh "$v"
          done

      # Report-only on PRs/pushes (a newly published CVE must not block
      # unrelated work); fails on the weekly run so fixable CVEs surface.
      # The release workflow gates publishing on the same scan.
      - name: Trivy scan — CRITICAL/HIGH with a fix available
        env:
          EXIT_CODE: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          docker run --rm --user root \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/images/devsecops/.trivyignore:/trivyignore:ro" \
            ufawkes-devsecops-core:ci \
            trivy image --no-progress --scanners vuln \
              --severity CRITICAL,HIGH --ignore-unfixed \
              --ignorefile /trivyignore --exit-code "$EXIT_CODE" \
              ufawkes-devsecops-ai:ci

      # ai contains every lower layer, so its fingerprint covers all variants.
      - name: Determinism — rebuild without cache and compare
        run: |
          fingerprint() {
            docker run --rm --network none "$1" bash -c '
              cat /etc/ufawkes/tools.json
              uv pip freeze --python /opt/ufawkes/venv
              uv pip freeze --python /opt/ufawkes/venv-gitops
              npm ls --prefix /opt/ufawkes/node --all --json'
          }
          fingerprint ufawkes-devsecops-ai:ci >first.txt
          (cd images/devsecops && TAG=rebuild docker buildx bake --load --no-cache ai)
          fingerprint ufawkes-devsecops-ai:rebuild >second.txt
          diff -u first.txt second.txt
          echo "✅ Identical toolchain across two clean builds"

      - name: Image sizes
        if: always()
        run: |
          docker image ls --filter 'reference=ufawkes-devsecops-*' \
            --format '{{.Repository}}:{{.Tag}} {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: job-finish
        if: always()
        run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
