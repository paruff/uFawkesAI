name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: "🔐 Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify .env.example has no concrete secret values
        shell: bash
        run: |
          set -euo pipefail

          sensitive_key_regex='(SECRET|TOKEN|PASSWORD|PRIVATE_KEY|ACCESS_KEY|API_KEY|DATABASE_URL|CONN_STRING|DSN)'
          placeholder_value_regex='^(|<.*>|REDACTED|CHANGEME|changeme|example|your_.*)$'

          while IFS= read -r line || [ -n "$line" ]; do
            trimmed="$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$trimmed" ] && continue
            case "$trimmed" in
              \#*) continue ;;
            esac

            key="${trimmed%%=*}"
            value="${trimmed#*=}"

            if printf '%s\n' "$key" | grep -Eiq "$sensitive_key_regex"; then
              if ! printf '%s\n' "$value" | grep -Eq "$placeholder_value_regex"; then
                echo "Concrete value detected for sensitive key '$key' in .env.example"
                exit 1
              fi
            fi
          done < .env.example

          echo "✅ .env.example secret-placeholder check passed"

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
