name: DevSecOps Image — Release

# Publishes ghcr.io/paruff/ufawkes-devsecops-{core,gitops,ai} when a human
# pushes a tag `image-vX.Y.Z` (docs/ai-sdlc/devsecops-image/spec.md R5/R6):
#   1. per arch (native runners): build, verify offline, Trivy gate
#      (CRITICAL/HIGH with a fix available → fail, except .trivyignore),
#      push `:X.Y.Z-<arch>`, SPDX SBOM (syft) attested to each arch digest;
#   2. merge arches into `:X.Y.Z`, `:X.Y`, `:X` indexes, keyless-sign each
#      index with cosign (GitHub OIDC), attest SLSA build provenance.
# Write/OIDC permissions exist only in this tag-triggered workflow; PR builds
# (image-build.yml) never hold them. The tools used to scan and generate the
# SBOM come from the image under release itself.

on:
  push:
    tags: ["image-v*"]

permissions: {}

concurrency:
  group: image-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: "📦 build, gate, push (${{ matrix.arch }})"
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: job-start
        run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # to prove the tagged commit is on main
          persist-credentials: false

      # Only reviewed code is published: the tag must point at main's history.
      - name: Tagged commit is on main
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::${GITHUB_SHA} is not on main — tag a merged commit"; exit 1; }

      - name: Resolve version from tag
        id: v
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#image-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::tag must look like image-vX.Y.Z, got ${REF_NAME}"; exit 1; }
          echo "version=${version}" >>"$GITHUB_OUTPUT"

      - name: Free runner disk (images + scan scratch ≈ 10 GB)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build all variants
        working-directory: images/devsecops
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REVISION: ${{ github.sha }}
        run: TAG=release docker buildx bake --load

      - name: Verify each variant (network disabled)
        run: |
          for v in core gitops ai; do
            docker run --rm --network none \
              -v "$PWD/images/devsecops/tests:/tests:ro" \
              "ufawkes-devsecops-$v:release" /tests/verify-tools.sh "$v"
          done

      # ai contains every package of core and gitops, so one scan gates all.
      - name: Trivy gate — CRITICAL/HIGH with a fix available
        run: |
          docker run --rm --user root \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/images/devsecops/.trivyignore:/trivyignore:ro" \
            ufawkes-devsecops-core:release \
            trivy image --no-progress --scanners vuln \
              --severity CRITICAL,HIGH --ignore-unfixed \
              --ignorefile /trivyignore --exit-code 1 \
              ufawkes-devsecops-ai:release

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push arch images, generate SBOMs
        id: push
        env:
          VERSION: ${{ steps.v.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p sbom
          for v in core gitops ai; do
            repo="${REGISTRY}/ufawkes-devsecops-${v}"
            docker tag "ufawkes-devsecops-${v}:release" "${repo}:${VERSION}-${ARCH}"
            docker push -q "${repo}:${VERSION}-${ARCH}"
            digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${repo}:${VERSION}-${ARCH}")"
            echo "${v}_digest=${digest#*@}" >>"$GITHUB_OUTPUT"
            docker run --rm --user root \
              -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/sbom" \
              ufawkes-devsecops-core:release \
              syft scan "docker:ufawkes-devsecops-${v}:release" -o "spdx-json=/sbom/${v}.spdx.json"
            echo "${repo}:${VERSION}-${ARCH} ${digest#*@}" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Attest SBOM — core
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/ufawkes-devsecops-core
          subject-digest: ${{ steps.push.outputs.core_digest }}
          sbom-path: sbom/core.spdx.json
          push-to-registry: true
      - name: Attest SBOM — gitops
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/ufawkes-devsecops-gitops
          subject-digest: ${{ steps.push.outputs.gitops_digest }}
          sbom-path: sbom/gitops.spdx.json
          push-to-registry: true
      - name: Attest SBOM — ai
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/ufawkes-devsecops-ai
          subject-digest: ${{ steps.push.outputs.ai_digest }}
          sbom-path: sbom/ai.spdx.json
          push-to-registry: true

      - name: job-finish
        if: always()
        run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

  publish:
    name: "🔏 index, sign, provenance"
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: job-start
        run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3" # matches tools.lock.json
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch indexes and sign them
        id: index
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#image-v}"
          minor="${version%.*}"
          major="${version%%.*}"
          for v in core gitops ai; do
            repo="${REGISTRY}/ufawkes-devsecops-${v}"
            docker buildx imagetools create \
              -t "${repo}:${version}" -t "${repo}:${minor}" -t "${repo}:${major}" \
              "${repo}:${version}-amd64" "${repo}:${version}-arm64"
            digest="$(docker buildx imagetools inspect "${repo}:${version}" --format '{{json .Manifest}}' | jq -r .digest)"
            cosign sign --yes "${repo}@${digest}"
            echo "${v}_digest=${digest}" >>"$GITHUB_OUTPUT"
            echo "| \`${repo}:${version}\` | \`${digest}\` |" >>"$GITHUB_STEP_SUMMARY"
          done

      - name: Provenance — core
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/ufawkes-devsecops-core
          subject-digest: ${{ steps.index.outputs.core_digest }}
          push-to-registry: true
      - name: Provenance — gitops
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/ufawkes-devsecops-gitops
          subject-digest: ${{ steps.index.outputs.gitops_digest }}
          push-to-registry: true
      - name: Provenance — ai
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/ufawkes-devsecops-ai
          subject-digest: ${{ steps.index.outputs.ai_digest }}
          push-to-registry: true

      - name: How to verify
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          {
            echo ""
            echo "Verify a published index:"
            echo '```'
            echo "cosign verify ${REGISTRY}/ufawkes-devsecops-core@<digest> \\"
            echo "  --certificate-identity '${GITHUB_SERVER_URL}/${WORKFLOW_REF}' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://${REGISTRY}/ufawkes-devsecops-core@<digest> --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: job-finish
        if: always()
        run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
