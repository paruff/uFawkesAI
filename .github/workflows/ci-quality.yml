name: CI Quality Gate
on:
  pull_request:
    branches:
    - main
    - develop
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-quality-${{ github.event_name == 'pull_request' && github.ref || github.sha
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  preflight:
    name: "\u2708\uFE0F Pre-flight"
    uses: ./.github/workflows/reusable-preflight.yml
    with:
      pr-size-limit: 400
      commit-format: conventional
      emergency-bypass: true
  lint:
    name: "\U0001F50D Lint"
    uses: ./.github/workflows/reusable-lint.yml
    with:
      auto-detect: true
      emergency-bypass: true
  artifact-chain:
    name: "\U0001F517 Artifact Chain"
    uses: ./.github/workflows/artifact-chain.yml
  symlink-check:
    name: "\U0001F517 Agent Symlinks"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: job-start
      run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Verify symlinks
      run: "test -L CLAUDE.md\ntest -L .github/copilot-instructions.md\ntest -L .cursorrules\n\
        test -f CLAUDE.md\ntest -f .github/copilot-instructions.md\ntest -f .cursorrules\n\
        test \"$(readlink CLAUDE.md)\" = \"AGENTS.md\"\ntest \"$(readlink .github/copilot-instructions.md)\"\
        \ = \"../AGENTS.md\"\ntest \"$(readlink .cursorrules)\" = \"AGENTS.md\"\n\
        echo \"\u2705 Agent symlinks resolve correctly\"\n"
    - name: job-finish
      run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
  dual-harness-smoke:
    name: "\U0001F9E9 Dual-Harness Smoke Test"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: job-start
      run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build DevSecOps images locally (core, gitops, ai)
      working-directory: images/devsecops
      run: TAG=ci docker buildx bake --load
    - name: Build devcontainer image locally with local base image
      run: docker buildx build --build-arg BASE_IMAGE=ufawkes-devsecops-ai:ci -f .devcontainer/Dockerfile
        -t ufawkesai-devcontainer:ci --load .
    - name: Run smoke test in devcontainer
      run: docker run --rm -v "$PWD:/workspace" -w /workspace ufawkesai-devcontainer:ci
        bash scripts/dual-harness-smoke.sh
    - name: job-finish
      run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
  lint-placeholder:
    name: "\U0001F50D Lint (Placeholder)"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: job-start
      run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.23.2
        cache: npm
    - run: npm ci
    - name: Run ESLint placeholder
      run: "npm run lint\necho \"\u2705 Lint passed (placeholder)\"\n"
    - name: job-finish
      run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
  typecheck:
    name: "\U0001F537 TypeScript"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: job-start
      run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.23.2
        cache: npm
    - run: npm ci
    - name: Run TypeScript compiler placeholder
      run: "npm run typecheck\necho \"\u2705 TypeScript passed (placeholder)\"\n"
    - name: job-finish
      run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
  test:
    name: "\U0001F9EA Tests & Coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: job-start
      run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.23.2
        cache: npm
    - run: npm ci
    - name: Run tests with coverage placeholder
      run: "npm run test:coverage\necho \"\u2705 Tests passed (placeholder)\"\n"
    - name: Check coverage threshold
      run: "# [PLACEHOLDER] \u2014 replace with your coverage tool's threshold check\n\
        # Example for Jest: configured in jest.config.js with coverageThreshold\n\
        # This step fails if coverage drops below 80%\necho \"Coverage threshold:\
        \ 80% (configured in jest.config.js)\"\n"
    - name: job-finish
      run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
  architecture:
    name: "\U0001F3D7\uFE0F Architecture Boundaries"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: job-start
      run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.23.2
        cache: npm
    - run: npm ci
    - name: Check architecture boundaries placeholder
      run: "npm run lint:architecture\necho \"\u2705 Architecture boundaries respected\
        \ (placeholder)\"\n"
    - name: job-finish
      run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
  ci-summary:
    name: "\u2705 CI Complete"
    needs:
    - preflight
    - lint
    - artifact-chain
    - symlink-check
    - dual-harness-smoke
    - lint-placeholder
    - typecheck
    - test
    - architecture
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: job-start
      run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
    - name: Check all gates
      run: "if [ \"${{ needs.preflight.result }}\" == \"failure\" ] || \\\n   [ \"\
        ${{ needs.lint.result }}\" == \"failure\" ] || \\\n   [ \"${{ needs.artifact-chain.result\
        \ }}\" != \"success\" ] || \\\n   [ \"${{ needs.symlink-check.result }}\"\
        \ == \"failure\" ] || \\\n   [ \"${{ needs.dual-harness-smoke.result }}\"\
        \ == \"failure\" ] || \\\n   [ \"${{ needs.lint-placeholder.result }}\" ==\
        \ \"failure\" ] || \\\n   [ \"${{ needs.typecheck.result }}\" == \"failure\"\
        \ ] || \\\n   [ \"${{ needs.test.result }}\" == \"failure\" ] || \\\n   [\
        \ \"${{ needs.architecture.result }}\" == \"failure\" ]; then\n  echo \"\u274C\
        \ One or more CI gates failed\"\n  exit 1\nfi\necho \"\u2705 All CI gates\
        \ passed \u2014 ready for human review\"\n"
    - name: Generate quality summary
      if: always()
      run: "echo \"## Quality Gate Results\" >> $GITHUB_STEP_SUMMARY\necho \"\" >>\
        \ $GITHUB_STEP_SUMMARY\necho \"| Gate | Status |\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"|------|--------|\" >> $GITHUB_STEP_SUMMARY\necho \"| Pre-flight |\
        \ ${{ needs.preflight.result == 'success' && '\u2705 Pass' || (needs.preflight.result\
        \ == 'skipped' && '\u23ED\uFE0F Skipped' || '\u274C Fail') }} |\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"| Lint | ${{ needs.lint.result == 'success' && '\u2705 Pass' || (needs.lint.result\
        \ == 'skipped' && '\u23ED\uFE0F Skipped' || '\u274C Fail') }} |\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"| Artifact Chain | ${{ needs.artifact-chain.result == 'success' &&\
        \ '\u2705 Pass' || '\u274C Fail' }} |\" >> $GITHUB_STEP_SUMMARY\necho \"|\
        \ Symlinks | ${{ needs.symlink-check.result == 'success' && '\u2705 Pass'\
        \ || '\u274C Fail' }} |\" >> $GITHUB_STEP_SUMMARY\necho \"| Dual-Harness Smoke\
        \ | ${{ needs.dual-harness-smoke.result == 'success' && '\u2705 Pass' || '\u274C\
        \ Fail' }} |\" >> $GITHUB_STEP_SUMMARY\necho \"| Lint (Placeholder) | ${{\
        \ needs.lint-placeholder.result == 'success' && '\u2705 Pass' || '\u274C Fail'\
        \ }} |\" >> $GITHUB_STEP_SUMMARY\necho \"| TypeScript | ${{ needs.typecheck.result\
        \ == 'success' && '\u2705 Pass' || '\u274C Fail' }} |\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"| Tests | ${{ needs.test.result == 'success' && '\u2705 Pass' || '\u274C\
        \ Fail' }} |\" >> $GITHUB_STEP_SUMMARY\necho \"| Architecture | ${{ needs.architecture.result\
        \ == 'success' && '\u2705 Pass' || '\u274C Fail' }} |\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"\" >> $GITHUB_STEP_SUMMARY\necho \"### DORA Metrics\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"- **Total gates**: 9\" >> $GITHUB_STEP_SUMMARY\n echo \"- **Parallel\
        \ execution**: Yes\" >> $GITHUB_STEP_SUMMARY\n echo \"- **Estimated time**:\
        \ ~5 min\" >> $GITHUB_STEP_SUMMARY\n"
    - name: job-finish
      run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
  dora-events:
    name: "\U0001F4E1 Delivery Events"
    needs: ci-summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME || 'ufawkesai' }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      DORA_EVENTS_FILE: ${{ github.workspace }}/dora-events.jsonl
    steps:
    - name: job-start
      run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Self-test the emitter
      run: 'pip install --quiet ''jsonschema==4.25.1''

        bash scripts/test-emit-dora-event.sh

        '
    - name: Emit delivery events
      env:
        DEPLOY_ENVIRONMENT: ${{ vars.DORA_ENVIRONMENT || 'main' }}
        IS_DELIVERY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'
          }}
      run: "started_at=\"$(gh api \"repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"\
        \ --jq .run_started_at)\"\nbash scripts/emit-dora-event.sh job-start --step\
        \ ci-quality --at \"$started_at\"\nbash scripts/emit-dora-event.sh job-finish\
        \ --step ci-quality --started-at \"$started_at\"\nif [ \"$IS_DELIVERY\" =\
        \ true ]; then\n  bash scripts/emit-dora-event.sh deploy-marker --step ci-quality\
        \ --environment \"$DEPLOY_ENVIRONMENT\"\nfi\n{\n  echo \"### \U0001F4E1 Delivery\
        \ events\"\n  echo '```json'\n  jq . \"$DORA_EVENTS_FILE\"\n  echo '```'\n\
        } >>\"$GITHUB_STEP_SUMMARY\"\n"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: dora-events
        path: dora-events.jsonl
        if-no-files-found: error
    - name: job-finish
      if: always()
      run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
