name: Agent Config Evals

# Continuous evals: any change to the agent configuration replays
# .agents/evals/tasks against the new config and blocks if the pass rate drops
# below .agents/evals/baseline.json (continuous-evals skill).
#
# Runs through OpenCode (first-class harness), reusing the suite's existing
# provider keys. The model is the repository variable EVAL_MODEL (default
# google/gemini-3.1-flash-lite); its provider prefix picks the key:
#   google/*   -> GEMINI_API_KEY      opencode/* -> OPENCODE_API_KEY
# Without that secret the job FAILS with an explicit message — a skipped eval
# must never look like a passing one.

# Triggers (AC-AI-07, per the playbook): every change to rules, skills,
# agents or hooks, every push to main, and weekly — a model or provider can
# drift with no change in this repo. Each task is scored on task success, tool
# use and trajectory against .agents/evals/baseline.json.
# On PRs the job always runs (so branch protection can require it) and runs
# the model only when a config path changed; otherwise it says so and passes.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - ".agents/**"
      - ".claude/**"
      - ".opencode/**"
      - "opencode.json"
      - "scripts/hooks/**"
      - ".pre-commit-config.yaml"
      - "scripts/run-evals.sh"
      - "scripts/test-run-evals.sh"
      - ".github/workflows/agent-config-ci.yml"
  schedule:
    - cron: "41 5 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-config-evals-${{ github.ref }}
  cancel-in-progress: true

env:
  EVAL_MODEL: ${{ vars.EVAL_MODEL || 'google/gemini-3.1-flash-lite' }}

jobs:
  evals:
    name: "🧪 Agent config evals"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: job-start
        run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # Keep this list in sync with on.push.paths above.
      - name: Did this PR change the agent configuration?
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" != pull_request ]; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" HEAD -- AGENTS.md .agents .claude .opencode \
            opencode.json scripts/hooks .pre-commit-config.yaml scripts/run-evals.sh \
            scripts/test-run-evals.sh .github/workflows/agent-config-ci.yml)"
          if [ -n "$changed" ]; then
            echo "Agent configuration changed:"
            echo "$changed"
            echo "changed=true" >>"$GITHUB_OUTPUT"
          else
            echo "No agent configuration changed in this PR: evals not needed, gate passes." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Require the API key (no silent skip)
        if: steps.changes.outputs.changed == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          case "${EVAL_MODEL%%/*}" in
            google) key=GEMINI_API_KEY ;;
            opencode) key=OPENCODE_API_KEY ;;
            *) echo "::error::EVAL_MODEL '${EVAL_MODEL}' has no key mapping (google/* or opencode/*)"; exit 1 ;;
          esac
          if [ -z "${!key}" ]; then
            echo "::error::${key} secret is not set for ${EVAL_MODEL} — evals did NOT run. Add the secret or this gate stays red."
            exit 1
          fi
      - name: Self-test the gate (offline)
        if: steps.changes.outputs.changed == 'true'
        run: bash scripts/test-run-evals.sh
      # Same OpenCode version the DevSecOps image pins (tools.lock.json).
      - name: Install OpenCode
        if: steps.changes.outputs.changed == 'true'
        run: npm install -g opencode-ai@1.18.32
      - name: Run evals against this configuration
        if: steps.changes.outputs.changed == 'true'
        env:
          # OpenCode's google provider reads GOOGLE_GENERATIVE_AI_API_KEY, not
          # GEMINI_API_KEY (without it: "Google Generative AI API key is missing").
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          EVAL_HARNESS: opencode
        # Empty config dir: no machine/plugin config can change which model answers.
        run: XDG_CONFIG_HOME="$(mktemp -d)" bash scripts/run-evals.sh
      - name: Upload eval report
        if: always() && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evals-report
          path: .agents/logs/evals-report.json
          if-no-files-found: warn
      - name: job-finish
        if: always()
        run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
