name: Board Mirror

# Mirrors a change's gate state onto its Project #7 item (seam R7). Writes to the board only.
# Logic: scripts/board-mirror.sh. The issue is `issue:` in the change's intent.md front matter.

on:
  push:
    branches: ["change/**"]
  pull_request:
    types: [opened, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: board-mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    name: "🪞 Board Mirror"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # A user-owned Project v2 needs a PAT with `project` scope; GITHUB_TOKEN is only a fallback.
      GH_TOKEN: ${{ secrets.BOARD_TOKEN || github.token }}
      BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.2
      - run: npm ci --ignore-scripts
      - name: Mirror
        if: github.event.action != 'closed' # a closed or merged PR has no board state of its own (R7 defines none)
        run: |
          case "$BRANCH" in change/*) ;; *) echo "not a change branch"; exit 0 ;; esac
          slug="${BRANCH#change/}"
          scripts/sdlc-seam status "$slug" --json > "$RUNNER_TEMP/status.json"
          dir="$(jq -r .artifactsDir "$RUNNER_TEMP/status.json")"
          issue="$(sed -n '/^---$/,/^---$/s/^issue: *["#]\{0,2\}\([0-9]\+\).*/\1/p' "$dir/intent.md" | head -1)"
          [ -n "$issue" ] || { echo "no 'issue:' in $dir/intent.md front matter; nothing to mirror"; exit 0; }
          pr_open="$(gh pr list --head "$BRANCH" --state open --json number --jq 'length' --repo "$GITHUB_REPOSITORY")"
          args=()
          [ "$pr_open" -gt 0 ] && args+=(--pr-open)
          scripts/board-mirror.sh "$RUNNER_TEMP/status.json" "$issue" "${args[@]}"
