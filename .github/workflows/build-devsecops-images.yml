# Build and publish uFawkes DevSecOps toolchain image + devcontainer image
# Trigger: tag push (v*), manual dispatch
# Publishes: ghcr.io/paruff/ufawkes-devsecops-core, ghcr.io/paruff/ufawkes-devsecops-gitops, ghcr.io/paruff/ufawkes-devsecops-ai, ghcr.io/paruff/ufawkesai-devcontainer

name: Build & Publish DevSecOps Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to GHCR'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  OWNER: paruff

jobs:
  build-devsecops:
    name: Build DevSecOps images
    runs-on: ubuntu-latest
    outputs:
      core-digest: ${{ steps.core.outputs.digest }}
      gitops-digest: ${{ steps.gitops.outputs.digest }}
      ai-digest: ${{ steps.ai.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for core
        id: meta-core
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/ufawkes-devsecops-core
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push core
        id: core
        uses: docker/build-push-action@v6
        with:
          context: ./images/devsecops
          target: core
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-core.outputs.tags }}
          labels: ${{ steps.meta-core.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Extract metadata for gitops
        id: meta-gitops
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/ufawkes-devsecops-gitops
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push gitops
        id: gitops
        uses: docker/build-push-action@v6
        with:
          context: ./images/devsecops
          target: gitops
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-gitops.outputs.tags }}
          labels: ${{ steps.meta-gitops.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Extract metadata for ai
        id: meta-ai
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/ufawkes-devsecops-ai
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ai
        id: ai
        uses: docker/build-push-action@v6
        with:
          context: ./images/devsecops
          target: ai
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  build-devcontainer:
    name: Build devcontainer image
    runs-on: ubuntu-latest
    needs: build-devsecops
    outputs:
      version: ${{ steps.meta-devcontainer.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for devcontainer
        id: meta-devcontainer
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/ufawkesai-devcontainer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push devcontainer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-devcontainer.outputs.tags }}
          labels: ${{ steps.meta-devcontainer.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/ufawkes-devsecops-ai@${{ needs.build-devsecops.outputs.ai-digest }}

  live-acceptance-tests:
    name: Live acceptance tests
    runs-on: ubuntu-latest
    needs: build-devcontainer
    if: github.event_name != 'pull_request'
    container:
      image: ghcr.io/paruff/ufawkesai-devcontainer:${{ needs.build-devcontainer.outputs.version }}
      options: --user dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify harness parity
        run: scripts/check-harness-parity.sh

      - name: Verify agent dispatch
        run: scripts/check-agents.sh

      - name: Verify AI stance
        run: scripts/check-ai-stance.sh

      - name: Run unit test suites
        run: scripts/run-unit-tests.sh

      - name: Verify pre-commit hooks
        run: pre-commit run --all-files
