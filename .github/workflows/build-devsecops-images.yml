# The one workflow for the uFawkes DevSecOps images (core, ai) and the
# shared devcontainer (ghcr.io/paruff/fawkes-space-devcontainer) used by the
# uFawkes suite and fawkes. Replaces image-build.yml + image-release.yml.
#
#   PR / push to main (image paths): build ai natively on amd64 + arm64, verify
#     it offline (ai contains every core tool), Trivy report-only.
#   Weekly schedule / manual run: same, plus the Trivy gate and a no-cache
#     rebuild that must produce an identical toolchain (determinism).
#   Tag image-v<SemVer 2.0> (docs/ai-sdlc/devsecops-image/spec.md R6; distinct
#     from the template's v* release tags; always cut by a human): verify, then
#     publish multi-arch zstd images tagged X.Y.Z, X.Y, X and latest (a
#     pre-release gets only its exact version), reusing the verify jobs' build
#     cache, keyless-sign every digest (GitHub OIDC), BuildKit SBOM +
#     provenance, then run the live acceptance tests in the devcontainer.
#
# Verify a published image:
#   cosign verify ghcr.io/paruff/fawkes-space-ai@<digest> \
#     --certificate-identity-regexp '^https://github.com/paruff/uFawkesAI/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

name: DevSecOps Images — Build, Verify & Publish

on:
  pull_request:
    paths:
      - "images/devsecops/**"
      - "opencode/**"
      - ".agents/agents/**"
      - ".devcontainer/**"
      - "scripts/image-lock-refresh.sh"
      - "scripts/image-lock-bump.sh"
      - "scripts/test-image-lock-bump.sh"
      - ".github/workflows/build-devsecops-images.yml"
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes, so every image-v* tag publishes.
    tags: ["image-v*"]
    paths:
      - "images/devsecops/**"
      - "opencode/**"
      - ".agents/agents/**"
      - ".devcontainer/**"
      - "scripts/image-lock-refresh.sh"
      - "scripts/image-lock-bump.sh"
      - "scripts/test-image-lock-bump.sh"
      - ".github/workflows/build-devsecops-images.yml"
  schedule:
    - cron: "17 6 * * 1" # Mondays: re-verify the locked toolchain, rescan for new CVEs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-images-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io/paruff

jobs:
  verify:
    name: "🐳 verify ai (${{ matrix.arch }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      SCHEDULED: ${{ contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name) }}
    steps:
      - name: job-start
        run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - name: Self-test the lock bump script
        run: bash scripts/test-image-lock-bump.sh

      # Per-arch GHA cache: later runs and the publish job reuse these layers.
      - name: Build ai + polyglot (core is their build stage)
        working-directory: images/devsecops
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          TAG=ci docker buildx bake ai polyglot --load --allow=fs.read=../../opencode --allow=fs.read=../../.agents/agents \
            --set "*.cache-from=type=gha,scope=devsecops-${ARCH}" \
            --set "*.cache-to=type=gha,mode=max,scope=devsecops-${ARCH}"

      - name: Verify (network disabled)
        run: |
          docker run --rm --network none \
            -v "$PWD/images/devsecops/tests:/tests:ro" \
            -v "$PWD/images/devsecops/benchmarks:/devsecops/benchmarks:ro" \
            fawkes-space-ai:ci /tests/verify-tools.sh ai
          docker run --rm --network none \
            -v "$PWD/images/devsecops/tests:/tests:ro" \
            -v "$PWD/images/devsecops/benchmarks:/devsecops/benchmarks:ro" \
            fawkes-space-ai:ci-polyglot /tests/verify-tools.sh polyglot

      # Report-only on PRs/pushes (a newly published CVE must not block
      # unrelated work); the gate fails on weekly and manual runs so fixable
      # CVEs in repo-controlled packages surface.
      - name: Trivy — report whole image, gate repo-controlled packages
        env:
          GATE_EXIT: ${{ env.SCHEDULED == 'true' && '1' || '0' }}
        run: |
          mkdir -p scan-out
          docker run --rm --user root \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/images/devsecops:/devsecops:ro" -v "$PWD/scan-out:/out" \
            fawkes-space-ai:ci \
            /devsecops/scan.sh fawkes-space-ai:ci "$GATE_EXIT"
      - name: Trivy report to summary
        if: always()
        run: cat scan-out/trivy-report.md >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # Doubles the build time, so weekly/manual only.
      - name: Determinism — rebuild without cache and compare
        if: env.SCHEDULED == 'true'
        run: |
          fingerprint() {
            docker run --rm --network none "$1" bash -c '
              cat /etc/ufawkes/tools.json
              uv pip freeze --python /opt/ufawkes/venv
              npm ls --prefix /opt/ufawkes/node --all --json
              npm ls --prefix /opt/ufawkes/node-ai --all --json'
          }
          fingerprint fawkes-space-ai:ci >first.txt
          (cd images/devsecops && TAG=rebuild docker buildx bake --load --no-cache --allow=fs.read=../../opencode --allow=fs.read=../../.agents/agents ai)
          fingerprint fawkes-space-ai:rebuild >second.txt
          diff -u first.txt second.txt
          echo "✅ Identical toolchain across two clean builds"

      - name: Image size
        if: always()
        run: |
          docker image ls --filter 'reference=fawkes-space-ai:ci*' \
            --format '{{.Repository}}:{{.Tag}} {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cold/warm start benchmark
        if: env.SCHEDULED == 'true' || startsWith(github.ref, 'refs/tags/image-v')
        env:
          REGISTRY: ${{ env.REGISTRY }}
          BASELINE_FILE: ${{ github.workspace }}/images/devsecops/benchmarks/baseline.json
          REGRESSION_THRESHOLD: 10
          RUNS: 3
        run: |
          echo "## Cold/Warm Start Benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Variant | Arch | Image | Cold (ms) | Warm (ms) | Baseline Cold | Baseline Warm | Cold Δ% | Warm Δ% | Pass |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|------|-------|-----------|-----------|---------------|---------------|---------|---------|------|" >> "$GITHUB_STEP_SUMMARY"

          RESULTS_FILE=$(mktemp)
          ALL_PASS=true

          BENCH_SCRIPT="${{ github.workspace }}/images/devsecops/tests/benchmark-start.sh"

          # Determine tag: on tag pushes (image-v*), extract version; otherwise use 'ci'
          # github.ref_name is available in the runner context; use bash parameter expansion
          REF_NAME="${{ github.ref_name }}"
          if [[ "$REF_NAME" == image-v* ]]; then
            TAG="${REF_NAME#image-v}"
          else
            TAG="ci"
          fi

          for variant in core ai devcontainer; do
            for arch in amd64 arm64; do
              if [[ "$variant" == "core" ]]; then
                IMAGE="fawkes-space-core"
              elif [[ "$variant" == "ai" ]]; then
                IMAGE="fawkes-space-ai"
              else
                IMAGE="fawkes-space-devcontainer"
              fi

              echo "Benchmarking $IMAGE:$TAG-$arch ($variant-$arch)..."
              if RESULT=$("$BENCH_SCRIPT" "$IMAGE" "$TAG" "$variant" "$arch" 2>&1); then
                echo "$RESULT" >> "$RESULTS_FILE"
              else
                echo "Benchmark failed for $variant-$arch"
                cat <<< "$RESULT"
                ALL_PASS=false
              fi
            done
          done

          # Also benchmark polyglot variants if ai exists
          for arch in amd64 arm64; do
            echo "Benchmarking fawkes-space-ai:$TAG-$arch (devcontainer-polyglot-$arch)..."
            if RESULT=$("$BENCH_SCRIPT" "fawkes-space-ai" "$TAG" "devcontainer-polyglot" "$arch" 2>&1); then
              echo "$RESULT" >> "$RESULTS_FILE"
            else
              echo "Benchmark failed for devcontainer-polyglot-$arch"
              cat <<< "$RESULT"
              ALL_PASS=false
            fi
          done

          # Aggregate results into summary table
          while IFS= read -r line; do
            if echo "$line" | jq -e '.key' >/dev/null 2>&1; then
              key=$(echo "$line" | jq -r '.key')
              variant=$(echo "$line" | jq -r '.variant')
              arch=$(echo "$line" | jq -r '.arch')
              image=$(echo "$line" | jq -r '.image')
              cold=$(echo "$line" | jq -r '.cold_ms')
              warm=$(echo "$line" | jq -r '.warm_ms')
              base_cold=$(echo "$line" | jq -r '.baseline_cold_ms')
              base_warm=$(echo "$line" | jq -r '.baseline_warm_ms')
              reg_cold=$(echo "$line" | jq -r '.cold_regression_pct')
              reg_warm=$(echo "$line" | jq -r '.warm_regression_pct')
              pass=$(echo "$line" | jq -r '.pass')

              cold_status="✅"
              warm_status="✅"
              [[ $reg_cold -gt 10 ]] && cold_status="❌"
              [[ $reg_warm -gt 10 ]] && warm_status="❌"
              [[ $pass == "false" ]] && ALL_PASS=false

              pass_icon="❌"
              [[ $pass == "true" ]] && pass_icon="✅"
              echo "| $variant | $arch | $image | $cold | $warm | $base_cold | $base_warm | ${reg_cold}% $cold_status | ${reg_warm}% $warm_status | $pass_icon |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < "$RESULTS_FILE"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$ALL_PASS" == "true" ]]; then
            echo "✅ All benchmarks within 10% threshold" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Some benchmarks exceeded 10% regression threshold" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: job-finish
        if: always()
        run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

  publish:
    name: "📦 publish + sign"
    needs: verify
    if: startsWith(github.ref, 'refs/tags/image-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    outputs:
      version: ${{ steps.meta-devcontainer.outputs.version }}
    steps:
      - name: job-start
        run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # QEMU only runs arm64 steps the verify job's arm64 cache does not cover.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Strict SemVer 2.0 (semver.org's official regex): a malformed tag must
      # fail here, not publish an image nobody can pin.
      - name: Validate SemVer 2.0 tag
        id: semver
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          v="${REF_NAME#image-v}"
          re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if ! [[ "$v" =~ $re ]]; then
            echo "::error::'${REF_NAME}' is not image-v<SemVer 2.0> (e.g. image-v1.0.0, image-v1.1.0-rc.1)"
            exit 1
          fi
          prerelease=false
          [[ "$v" == *-* ]] && prerelease=true
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"
          echo "Publishing $v (prerelease=$prerelease)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Tags for core
        id: meta-core
        # Index-level annotations carry org.opencontainers.image.source, which is
        # what links a multi-arch GHCR package to this repo (labels alone don't).
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/fawkes-space-core
          tags: |
            type=semver,pattern={{version}},value=${{ steps.semver.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.semver.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.semver.outputs.version }}
            type=raw,value=latest,enable=${{ steps.semver.outputs.prerelease == 'false' }}
          flavor: latest=false
      - name: Tags for ai
        id: meta-ai
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/fawkes-space-ai
          tags: |
            type=semver,pattern={{version}},value=${{ steps.semver.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.semver.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.semver.outputs.version }}
            type=raw,value=latest,enable=${{ steps.semver.outputs.prerelease == 'false' }}
          flavor: latest=false
      - name: Tags for devcontainer
        id: meta-devcontainer
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/fawkes-space-devcontainer
          tags: |
            type=semver,pattern={{version}},value=${{ steps.semver.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.semver.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.semver.outputs.version }}
            type=raw,value=latest,enable=${{ steps.semver.outputs.prerelease == 'false' }}
          flavor: latest=false

      - name: Tags for ai polyglot
        id: meta-ai-polyglot
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/fawkes-space-ai
          tags: |
            type=semver,pattern={{version}},value=${{ steps.semver.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.semver.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.semver.outputs.version }}
            type=raw,value=polyglot,suffix=,enable=${{ steps.semver.outputs.prerelease == 'false' }}
          flavor: |
            latest=false
            suffix=-polyglot
      - name: Tags for devcontainer polyglot
        id: meta-devcontainer-polyglot
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/fawkes-space-devcontainer
          tags: |
            type=semver,pattern={{version}},value=${{ steps.semver.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.semver.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.semver.outputs.version }}
            type=raw,value=polyglot,suffix=,enable=${{ steps.semver.outputs.prerelease == 'false' }}
          flavor: |
            latest=false
            suffix=-polyglot
      # One Dockerfile, several targets: ai reuses core's layers in-job,
      # and each arch reuses the verify job's cache for that arch.
      # zstd: smaller pulls and faster unpacking than gzip (needs Docker >= 23).
      - name: Build + push core
        id: core
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./images/devsecops
          build-contexts: |
            opencode-src=./opencode
            agents-src=./.agents/agents
          target: core
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-core.outputs.tags }}
          labels: ${{ steps.meta-core.outputs.labels }}
          annotations: ${{ steps.meta-core.outputs.annotations }}
          outputs: type=image,push=true,compression=zstd,force-compression=true,oci-mediatypes=true
          cache-from: |
            type=gha,scope=devsecops-amd64
            type=gha,scope=devsecops-arm64
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.meta-core.outputs.version }}
            REVISION=${{ github.sha }}
      - name: Build + push ai
        id: ai
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./images/devsecops
          build-contexts: |
            opencode-src=./opencode
            agents-src=./.agents/agents
          target: ai
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}
          annotations: ${{ steps.meta-ai.outputs.annotations }}
          outputs: type=image,push=true,compression=zstd,force-compression=true,oci-mediatypes=true
          cache-from: |
            type=gha,scope=devsecops-amd64
            type=gha,scope=devsecops-arm64
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.meta-ai.outputs.version }}
            REVISION=${{ github.sha }}
      - name: Build + push devcontainer (on the ai digest just pushed)
        id: devcontainer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-devcontainer.outputs.tags }}
          labels: ${{ steps.meta-devcontainer.outputs.labels }}
          annotations: ${{ steps.meta-devcontainer.outputs.annotations }}
          outputs: type=image,push=true,compression=zstd,force-compression=true,oci-mediatypes=true
          provenance: mode=max
          sbom: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/fawkes-space-ai@${{ steps.ai.outputs.digest }}

      - name: Build + push ai polyglot (ai + Java LSP)
        id: ai-polyglot
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./images/devsecops
          build-contexts: |
            opencode-src=./opencode
            agents-src=./.agents/agents
          target: polyglot
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-ai-polyglot.outputs.tags }}
          labels: ${{ steps.meta-ai-polyglot.outputs.labels }}
          annotations: ${{ steps.meta-ai-polyglot.outputs.annotations }}
          outputs: type=image,push=true,compression=zstd,force-compression=true,oci-mediatypes=true
          cache-from: |
            type=gha,scope=devsecops-amd64
            type=gha,scope=devsecops-arm64
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.meta-ai-polyglot.outputs.version }}
            REVISION=${{ github.sha }}
      - name: Build + push devcontainer polyglot (on the polyglot digest)
        id: devcontainer-polyglot
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-devcontainer-polyglot.outputs.tags }}
          labels: ${{ steps.meta-devcontainer-polyglot.outputs.labels }}
          annotations: ${{ steps.meta-devcontainer-polyglot.outputs.annotations }}
          outputs: type=image,push=true,compression=zstd,force-compression=true,oci-mediatypes=true
          provenance: mode=max
          sbom: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/fawkes-space-ai@${{ steps.ai-polyglot.outputs.digest }}
            LSP_PLUGINS=ufawkes-lsp ufawkes-lsp-java

      - name: Sign every digest (keyless, GitHub OIDC)
        env:
          CORE: ${{ steps.core.outputs.digest }}
          AI: ${{ steps.ai.outputs.digest }}
          DEVCONTAINER: ${{ steps.devcontainer.outputs.digest }}
          AI_POLYGLOT: ${{ steps.ai-polyglot.outputs.digest }}
          DEVCONTAINER_POLYGLOT: ${{ steps.devcontainer-polyglot.outputs.digest }}
        run: |
          for ref in "fawkes-space-core@${CORE}" \
            "fawkes-space-ai@${AI}" "fawkes-space-devcontainer@${DEVCONTAINER}" \
            "fawkes-space-ai@${AI_POLYGLOT}" "fawkes-space-devcontainer@${DEVCONTAINER_POLYGLOT}"; do
            cosign sign --yes "${REGISTRY}/${ref}"
            echo "- signed \`${REGISTRY}/${ref}\`" >>"$GITHUB_STEP_SUMMARY"
          done
      - name: job-finish
        if: always()
        run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

  live-acceptance-tests:
    name: Live acceptance tests
    runs-on: ubuntu-latest
    needs: publish
    container:
      # `env` is not available in jobs.<id>.container, hence the literal path.
      image: ghcr.io/paruff/fawkes-space-devcontainer:${{ needs.publish.outputs.version }}
      options: --user dev
    steps:
      - name: job-start
        run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify all four harnesses
        run: scripts/multi-harness-smoke.sh
      - name: Verify agent dispatch
        run: scripts/check-agents.sh
      - name: Verify AI stance
        run: scripts/check-ai-stance.sh
      - name: Run unit test suites
        run: scripts/run-unit-tests.sh
      - name: Verify pre-commit hooks
        run: pre-commit run --all-files
      - name: job-finish
        if: always()
        run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
