name: DevSecOps Image — Lock Bump

# Weekly: moves the image toolchain to the newest upstream releases with
# scripts/image-lock-bump.sh (tools.lock.json with re-verified checksums,
# Python hash locks, apt snapshot) and opens or updates one PR from the
# `chore/image-lock-bump` branch. Node tools and the base image digest are
# Dependabot's. Nothing is merged or released automatically.
#
# PRs opened with GITHUB_TOKEN don't trigger pull_request workflows, so this
# dispatches the CI Quality Gate (→ "✅ CI Complete", required on main) and
# the image build/verify/CVE gate on the branch itself.
#
# Needs the repo setting "Allow GitHub Actions to create and approve pull
# requests" (Settings → Actions → General) for `gh pr create` to succeed.

on:
  schedule:
    - cron: "23 5 * * 0" # Sundays, ahead of Monday's image-build rescan
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-lock-bump
  cancel-in-progress: false

env:
  BRANCH: chore/image-lock-bump

jobs:
  bump:
    name: "⬆️ Bump image toolchain"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open/update the bump PR
      actions: write # dispatch CI on the bump branch
    steps:
      - name: job-start
        run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Self-test the bump script (per-tool failures must not abort)
        run: bash scripts/test-image-lock-bump.sh

      - name: Bump locks
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_SUMMARY: ${{ runner.temp }}/bump-summary.md
        run: |
          bash scripts/image-lock-bump.sh
          cat "$BUMP_SUMMARY" >>"$GITHUB_STEP_SUMMARY"

      - name: Open or update the bump PR
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_SUMMARY: ${{ runner.temp }}/bump-summary.md
        run: |
          if git diff --quiet; then
            echo "Toolchain already current — nothing to propose." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -qam "chore(image): bump locked toolchain ($(date -u +%Y-%m-%d))"
          gh auth setup-git
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          {
            cat "$BUMP_SUMMARY"
            echo
            echo "Opened by \`image-lock-bump.yml\`. CI was dispatched on this branch"
            echo "(bot PRs don't trigger pull_request workflows). Review TOFU tools, then merge."
          } >"${RUNNER_TEMP}/pr-body.md"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --body-file "${RUNNER_TEMP}/pr-body.md"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(image): bump locked toolchain" \
              --body-file "${RUNNER_TEMP}/pr-body.md"
          fi

          gh workflow run ci-quality.yml --ref "$BRANCH"
          gh workflow run build-devsecops-images.yml --ref "$BRANCH"
      - name: job-finish
        if: always()
        run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
