name: Artifact Chain

# Enforces the SDLC engine's approval gates on pull requests (seam spec R6.4):
# a PR that changes code paths (.artifact-chain-paths) needs a change whose
# intent, spec and plan are all approved. Logic: `scripts/sdlc-seam ci`, so a
# `--no-verify` push is still red here.
#
# Called by ci-quality.yml so its result feeds "✅ CI Complete", the status
# check the main-protection ruleset requires — a failure blocks the merge.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-chain:
    name: "🔗 Artifact Chain"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: job-start
        run: echo "job-start $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # merge-base and branch history
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.2
      - name: Install the pinned engine
        run: npm ci --ignore-scripts

      # Dependabot and image-lock-bump.yml bump lockfiles, requirements and base
      # images under the code paths, and a bot can't write a plan.md. Everything
      # else is checked (#189 failed here before the lock bump was listed). Keyed
      # on the PR's author and branch, not github.actor, which is whoever pushed.
      - name: Check this PR's artifact chain
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && !(github.event.pull_request.user.login == 'github-actions[bot]'
               && github.event.pull_request.head.ref == 'chore/image-lock-bump')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/sdlc-seam ci --base "origin/$BASE_REF"

      - name: job-finish
        if: always()
        run: echo "job-finish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
