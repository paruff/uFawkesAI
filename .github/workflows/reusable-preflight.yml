# Vendored copy — source: paruff/ufawkespipe@v1.7.1-beta.1 .github/workflows/reusable-preflight.yml
# Vendored on 2026-09-27 so this template's CI has no runtime dependency on an
# external org's reusable-workflow repo. Re-sync manually if ufawkespipe cuts a
# new tag with fixes you want (diff against paruff/ufawkespipe .github/workflows/reusable-preflight.yml).
# Local change: yamllint disable/enable line-length around the PR-size step
# (this repo's .yamllint caps lines at 200; upstream's comment body is longer).
#
name: Reusable Pre-flight

on:
  workflow_call:
    inputs:
      pr-size-limit:
        description: "Maximum lines changed in PR (0 = no limit)"
        required: false
        type: number
        default: 400
      commit-format:
        description: "Enforce commit message format (conventional)"
        required: false
        type: string
        default: "conventional"
      emergency-bypass:
        description: "Skip this stage (emergency bypass label detected)"
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 2
    outputs:
      result:
        description: "Preflight result (pass/fail)"
        value: ${{ jobs.preflight.outputs.result }}

permissions: {}  # deny all at workflow level; grant per job below

jobs:
  preflight:
    permissions:
      contents: read
      pull-requests: read
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      result: ${{ steps.outcome.outputs.result }}
    steps:
      # ── DORA Timestamp ──────────────────────────────────────────────────────
      - name: DORA job start
        run: |
          echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sha:${{ github.sha }}"
          echo "workflow:${{ github.workflow }}"
          echo "job:${{ github.job }}"

      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # ── Emergency Bypass Check ──────────────────────────────────────────────
      - name: Check emergency bypass
        id: bypass
        if: inputs.emergency-bypass && github.event_name == 'pull_request'
        run: |
          # Use GitHub CLI to check for emergency-bypass label (more reliable than contains())
          if gh pr view ${{ github.event.pull_request.number }} --json labels -q '.labels[].name' | grep -q '^emergency-bypass$'; then
            echo "⚠️ Emergency bypass label detected — skipping preflight checks"
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # ── Pre-commit Validation ───────────────────────────────────────────────
      - name: Set up Python
        if: steps.bypass.outputs.skipped != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6.1.1
        with:
          python-version: "3.11"

      - name: Install pre-commit
        if: steps.bypass.outputs.skipped != 'true'
        run: pip install 'pre-commit==4.6.0'

      - name: Cache pre-commit environments
        if: steps.bypass.outputs.skipped != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.5.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Run pre-commit hooks
        if: steps.bypass.outputs.skipped != 'true'
        run: pre-commit run --all-files

      # ── Local Preflight Script ──────────────────────────────────────────────
      - name: Run local preflight checks
        if: |
          steps.bypass.outputs.skipped != 'true' &&
          hashFiles('scripts/preflight.sh') != ''
        run: |
          chmod +x scripts/preflight.sh
          ./scripts/preflight.sh

      # ── PR Size Gate ────────────────────────────────────────────────────────
      # yamllint disable rule:line-length
      - name: Check PR size
        if: |
          steps.bypass.outputs.skipped != 'true' &&
          inputs.pr-size-limit > 0 &&
          github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          PR_SIZE_LIMIT: ${{ inputs.pr-size-limit }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const changed = pr.additions + pr.deletions;
            const limit = Number(process.env.PR_SIZE_LIMIT);
            const hasOverrideLabel = pr.labels.some(l => l.name === 'large-pr-approved');
            const hasBypassLabel = pr.labels.some(l => l.name === 'emergency-bypass');

            if (hasBypassLabel) {
              console.log(`⚠️ Emergency bypass active: ${changed} lines changed`);
              return;
            }

            if (changed > limit && !hasOverrideLabel) {
              // Warn-only: size limits guide, not block
              core.warning(
                `⚠️ PR size: ${changed} lines changed (limit: ${limit}). ` +
                `Large PRs slow down review — consider splitting into smaller chunks.`
              );

              // Post a one-time PR comment as guidance
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100
              });
              const marker = '<!-- pr-size-warning -->';
              const hasExistingComment = comments.some(c => c.body.includes(marker));
              if (!hasExistingComment) {
                // Warn-only: a missing issues:write grant (the job only requests
                // pull-requests:read) must not turn this guidance comment into a
                // hard failure — core.warning() above already surfaced the size
                // warning regardless of whether the comment succeeds.
                try {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    body: `${marker}\n## ⚠️ Large PR Detected\n\nThis PR changes **${changed} lines** (limit: ${limit}).\n\nLarge PRs are harder to review and more likely to introduce bugs. Consider splitting into smaller, focused PRs.\n\n> To suppress this warning, apply the \`large-pr-approved\` label.`
                  });
                } catch (err) {
                  core.warning(`Could not post large-PR guidance comment (non-blocking): ${err.message}`);
                }
              }
            } else if (changed > limit) {
              core.warning(`⚠️ Large PR override active: ${changed} lines changed. Human approved.`);
            } else {
              console.log(`✅ PR size: ${changed} lines (within ${limit} limit)`);
            }

      # yamllint enable rule:line-length

      # ── Commit Format Check ─────────────────────────────────────────────────
      # Only enforced on pull_request events: on push to main the commits are
      # merge commits that follow GitHub's PR title format, not conventional.
      - name: Check commit messages
        if: |
          steps.bypass.outputs.skipped != 'true' &&
          inputs.commit-format == 'conventional' &&
          github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const conventionalRegex = /^(feat|fix|docs|style|refactor|test|chore|ci|perf|build|revert)(\(.+\))?: .{1,72}$/;
            const mergeCommitRegex = /^Merge /;

            let commits;
            if (context.eventName === 'pull_request') {
              const { data: prCommits } = await github.rest.pulls.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100
              });
              commits = prCommits.map(c => ({ message: c.commit.message.split('\n')[0], sha: c.sha }));
            } else {
              // Only the commits in this push. Re-checking the last N commits on the
              // branch kept main red for N pushes after one bad merged title.
              // ponytail: the push payload lists at most 20 commits; use compareCommits if pushes get bigger
              commits = (context.payload.commits || []).map(c => ({ message: c.message.split('\n')[0], sha: c.id }));
            }

            let failures = 0;
            for (const commit of commits) {
              if (mergeCommitRegex.test(commit.message)) continue;
              if (!conventionalRegex.test(commit.message)) {
                core.error(`❌ Commit ${commit.sha.slice(0, 7)}: "${commit.message}"`);
                failures++;
              }
            }

            if (failures > 0) {
              core.setFailed(
                `❌ ${failures} commit(s) don't follow Conventional Commits format.\n` +
                `Expected: type(scope): description\n` +
                `Types: feat, fix, docs, style, refactor, test, chore, ci, perf, build, revert`
              );
            } else {
              console.log(`✅ All ${commits.length} commit(s) follow Conventional Commits format`);
            }

      # ── Secret Detection ────────────────────────────────────────────────────
      - name: Verify .env.example has no concrete secrets
        if: steps.bypass.outputs.skipped != 'true'
        run: |
          set -euo pipefail

          if [ ! -f .env.example ]; then
            echo "ℹ️ No .env.example found — skipping"
            exit 0
          fi

          sensitive_key_regex='(SECRET|TOKEN|PASSWORD|PRIVATE_KEY|ACCESS_KEY|API_KEY|DATABASE_URL|CONN_STRING|DSN)'
          placeholder_value_regex='^(|<.*>|REDACTED|CHANGEME|changeme|REPLACE_ME|example|your_.*)$'
          template_var_regex='\$\{?[A-Z_][A-Z0-9_]*\}?'

          while IFS= read -r line || [ -n "$line" ]; do
            trimmed="$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$trimmed" ] && continue
            case "$trimmed" in
              \#*) continue ;;
            esac

            key="${trimmed%%=*}"
            value="${trimmed#*=}"

            if printf '%s\n' "$key" | grep -Eiq "$sensitive_key_regex"; then
              if printf '%s\n' "$value" | grep -Eq "$placeholder_value_regex"; then
                :  # Known placeholder pattern — OK
              elif printf '%s\n' "$value" | grep -Eq "$template_var_regex"; then
                :  # Uses environment variable template — OK (e.g., ${PASSWORD}, $TOKEN)
              else
                echo "❌ Concrete value detected for sensitive key '$key' in .env.example"
                echo "   Value: $value"
                echo "   Allowed: empty, <placeholder>, REDACTED, CHANGEME, \${VAR} templates"
                exit 1
              fi
            fi
          done < .env.example

          echo "✅ .env.example secret-placeholder check passed"

      # ── Outcome ─────────────────────────────────────────────────────────────
      - name: Set outcome
        if: always()
        id: outcome
        run: |
          if [[ "${{ steps.bypass.outputs.skipped }}" == "true" ]]; then
            echo "result=skipped" >> $GITHUB_OUTPUT
          elif [[ "${{ job.status }}" == "success" ]]; then
            echo "result=pass" >> $GITHUB_OUTPUT
          else
            echo "result=fail" >> $GITHUB_OUTPUT
          fi

      # ── DORA Timestamp ──────────────────────────────────────────────────────
      - name: DORA job finish
        if: always()
        run: echo "job-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # ── Summary ─────────────────────────────────────────────────────────────
      - name: Generate summary
        if: always()
        env:
          PRECOMMIT: ${{ steps.bypass.outputs.skipped == 'true' && '⏭️ Skipped' || (job.status == 'success' && '✅ Pass' || '❌ Fail') }}
          PR_SIZE: ${{ inputs.pr-size-limit > 0 && '✅ Checked' || '⏭️ Skipped' }}
          COMMIT_FORMAT: ${{ inputs.commit-format == 'conventional' && '✅ Checked' || '⏭️ Skipped' }}
          SECRETS: ${{ steps.bypass.outputs.skipped == 'true' && '⏭️ Skipped' || '✅ Checked' }}
        run: |
          {
            echo "## Pre-flight Results"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Pre-commit | ${PRECOMMIT} |"
            echo "| PR Size | ${PR_SIZE} |"
            echo "| Commit Format | ${COMMIT_FORMAT} |"
            echo "| Secret Detection | ${SECRETS} |"
          } >>"$GITHUB_STEP_SUMMARY"
