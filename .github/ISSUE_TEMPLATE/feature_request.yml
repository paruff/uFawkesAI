name: Feature request
description: Propose an improvement to agent workflows, docs, or template capabilities
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: textarea
    id: dora_capability
    attributes:
      label: Which DORA AI Capability does this address?
      description: Name the capability and explain why this request maps to it.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve for agents?
      description: Describe the current pain and the expected improvement.
    validations:
      required: true
  - type: textarea
    id: tested_agents
    attributes:
      label: Which agents have you tested this with?
      description: List tested agents (Copilot / Claude Code / Cursor / Codex / other) and summarize outcomes.
    validations:
      required: true
