# Unified Pre-commit Configuration — uFawkes Suite Standard
# This file is the canonical source. Other repos should symlink or copy this.
# Managed by uFawkesAI template; update here, then propagate to suite repos.
#
# Install: pre-commit install --hook-type commit-msg
# Run: pre-commit run --all-files


exclude: |
  ^graphify-out/|^\.opencode/|^\.serena/|^\.agents/logs/|^\.claude/worktrees/

# One `pre-commit install` sets up every stage below (commit-msg and pre-push
# hooks are defined but only run if they are installed).
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  # ============================================================================
  # General Code Quality (Core)
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key

  # ============================================================================
  # Python — Ruff (lint + format, replaces flake8/black/isort)
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        name: Lint Python with Ruff
        args: ["--fix"]
      - id: ruff-format
        name: Format Python with Ruff

  # ============================================================================
  # YAML Linting
  # ============================================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: Lint YAML files
        args: ["-c", ".yamllint"]
        types: [yaml]

  # ============================================================================
  # Markdown Linting
  # ============================================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args: ["--config", ".markdownlint.json", "--fix"]
        exclude: ^CHANGELOG\.md$

  # ============================================================================
  # Security Scanning — Gitleaks (single comprehensive check)
  # ============================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Detect secrets with Gitleaks
        args: ["--config", ".gitleaks.toml"]

  # ============================================================================
  # Shell Linting (shellcheck-py mirror for offline use)
  # ============================================================================
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: Lint shell scripts with shellcheck
        args: ["--severity=warning"]

  # ============================================================================
  # Shell Formatting (shfmt)
  # ============================================================================
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        name: Format shell scripts with shfmt
        args: ["-i", "2", "-ci", "-bn", "-sr", "-w"]
        exclude: '^scripts/buildplatform\.sh$|^.*\.zsh$'

  # ============================================================================
  # Terraform (for repos with infra/)
  # ============================================================================
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
        name: Terraform format
        args: ["--args=-recursive"]
      - id: terraform_validate
        name: Terraform validate
        args: ["--hook-config=--retry-once-with-cleanup=true"]
      - id: terraform_tflint
        name: Terraform lint (TFLint)
        args: ["--args=--config=__GIT_WORKING_DIR__/.tflint.hcl"]
      - id: terraform_docs
        name: Terraform docs
        args: ["--args=--config=.terraform-docs.yml"]

  # ============================================================================
  # Kubernetes Manifest Validation
  # ============================================================================
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: insert-license
        name: Insert license header
        files: '\.(yaml|yml|tf)$'
        args:
          - --license-filepath
          - LICENSE
          - --comment-style
          - "#"
        exclude: ^(\.github/|\.pre-commit-config\.yaml|\.yamllint|platform/apps/.*/upstream/)

  # ============================================================================
  # Commit Message Validation (commit-msg stage)
  # ============================================================================
  - repo: local
    hooks:
      - id: conventional-commit
        name: Validate Conventional Commits format
        entry: scripts/commit-msg.sh
        language: script
        stages: [commit-msg]

  # ============================================================================
  # uFawkes Suite Specific Validations
  # ============================================================================
  - repo: local
    hooks:
      # Validate staged *-report.md files against their output contracts
      - id: agent-report-contracts
        name: Agent report contracts
        entry: .agents/hooks/pre-commit-agent.sh
        language: script
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      # DORA capability labels must match the canonical registry
      - id: dora-vocabulary
        name: DORA vocabulary
        entry: scripts/check-dora-vocabulary.sh
        language: script
        stages: [pre-commit]
        files: \.(md|yaml|yml)$
        pass_filenames: false

      # AI_STANCE.md completeness + currency
      - id: ai-stance
        name: AI stance audit
        entry: scripts/check-ai-stance.sh
        language: script
        stages: [pre-commit]
        files: (^|/)AI_STANCE\.md$|^\.agents/skills/ai-stance/
        pass_filenames: false

      # Unit tests (dependency-free offline suites)
      - id: unit-tests
        name: Unit tests (offline suites)
        entry: scripts/run-unit-tests.sh
        language: script
        stages: [pre-commit, pre-push]
        files: ^(scripts/(test-.*|emit-dora-event|check-secret-detection|check-ai-stance|check-dora-vocabulary|run-unit-tests|run-evals).*|templates/.*\.py)$
        pass_filenames: false

      # 4 execution-boundary agents must be valid AND dispatchable
      - id: agent-dispatch
        name: Agent dispatch
        entry: scripts/check-agents.sh
        language: script
        stages: [pre-commit]
        files: ^(\.agents/agents/|\.opencode/agents/)
        pass_filenames: false

      # Every harness symlink must resolve
      - id: harness-parity
        name: Harness parity
        entry: scripts/check-harness-parity.sh
        language: script
        stages: [pre-commit]
        files: ^(\.agents/|\.claude/|\.opencode/|\.cursor/|\.github/copilot-instructions\.md|GEMINI\.md|CLAUDE\.md|\.cursorrules)
        pass_filenames: false

      # Tool-backed hooks run through scripts/shift-left.sh require-tool: a missing tool
      # fails the hook (or prints SKIPPED when SHIFT_LEFT_ALLOW_MISSING names
      # it) instead of warning and passing (shift-left spec R4).

      # Kubernetes manifest validation (kubeconform)
      - id: kubeconform
        name: Validate Kubernetes manifests (kubeconform)
        entry: |
          scripts/shift-left.sh require-tool kubeconform -- bash -c '
            EXCLUDE_PATTERN="values.*\.yaml|kustomization\.yaml|devfiles/|recording-rules\.yaml|scrape-configs\.yaml|aliases\.yaml|dora\.yml"
            find infra/kubernetes platform -name "*.yaml" -o -name "*.yml" 2>/dev/null | grep -vE "$EXCLUDE_PATTERN" | xargs -I {} kubeconform -strict -ignore-missing-schemas {}
          '
        language: script
        pass_filenames: false
        files: '^(infra/kubernetes|platform)/.*\.(yaml|yml)$'

      # Kustomize build validation (every directory must build, not just the last)
      - id: kustomize-validate
        name: Validate Kustomize builds
        entry: |
          scripts/shift-left.sh require-tool kustomize -- bash -c '
            for dir in $(find infra/kubernetes -name "kustomization.yaml" -exec dirname {} \;); do
              echo "Validating $dir"
              kustomize build "$dir" > /dev/null || exit 1
            done
          '
        language: script
        pass_filenames: false
        files: '^infra/kubernetes/.*kustomization\.yaml$'

      # Backstage catalog files: parse-checked by check-yaml above, like all YAML.

      # ArgoCD Application validation (render check)
      - id: argocd-validate
        name: Validate ArgoCD applications (render check)
        entry: scripts/render-all-applications.sh
        language: script
        pass_filenames: false
        files: 'platform/apps/.*-application\.yaml$'

      # Helm chart linting (every chart must lint, not just the last)
      - id: helm-lint
        name: Lint Helm charts
        entry: |
          scripts/shift-left.sh require-tool helm -- bash -c '
            for chart in infra/kubernetes/*/Chart.yaml; do
              dir=$(dirname "$chart")
              echo "Linting $dir"
              helm lint "$dir" || exit 1
            done
          '
        language: script
        pass_filenames: false
        files: '^infra/kubernetes/.*/Chart\.yaml$'

      # Check for hardcoded secrets in K8s manifests (bash and grep only)
      - id: check-k8s-secrets
        name: Check for hardcoded secrets in K8s manifests
        entry: |
          bash -c '
            grep -r "kind: Secret" infra/kubernetes/ --include="*.yaml" --include="*.yml" 2>/dev/null \
              | grep -v "stringData: {}" \
              | grep -v "# Example" \
              | grep -v "# Template" \
              && exit 1 || exit 0
          '
        language: system
        pass_filenames: false
        files: '^infra/kubernetes/.*\.(yaml|yml)$'

      # MkDocs validation. No mkdocs.yml means nothing to build, which is not
      # the same as mkdocs missing: that fails.
      - id: mkdocs-validate
        name: Validate MkDocs configuration
        entry: |
          bash -c '
            [ -f mkdocs.yml ] || { echo "no mkdocs.yml: nothing to build"; exit 0; }
            out="$(mktemp -d)"
            scripts/shift-left.sh require-tool mkdocs -- mkdocs build --verbose --site-dir "$out"
            rc=$?
            rm -rf "$out"
            exit $rc
          '
        language: system
        pass_filenames: false
        files: '^(mkdocs\.yml|docs/.*\.md)$'

      # Requirements pinning check (ADR-034). Fails on any >= outside a comment.
      - id: requirements-pin-check
        name: Check requirements pinning (ADR-034)
        entry: |
          bash -c '
            found=0
            for f in "$@"; do
              if grep -nE ">=" "$f" | grep -vE "^[0-9]+:[[:space:]]*#" | grep -vE "python_requires"; then
                echo "$f: ADR-034 requires == exact pins. Found >= above."
                found=1
              fi
            done
            exit $found
          ' --
        language: system
        types: [text]
        files: '(requirements.*\.txt|requirements.*\.in)$'

  # ============================================================================
  # GitHub Actions and config schemas (uFawkes.dev shift-left spec R2)
  # ============================================================================
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflows (actionlint)

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
        name: Validate workflow schemas
      - id: check-dependabot
        name: Validate dependabot.yml schema

  # ============================================================================
  # Shared shift-left hooks from uFawkesPipe (keep last: the stamps record that
  # every hook above ran). Tools that aren't hooks run through scripts/shift-left.sh.
  # ============================================================================
  - repo: https://github.com/paruff/uFawkesPipe
    rev: v1.11.0-beta.1
    hooks:
      - id: shift-left-parity
      - id: semgrep
      - id: trivy
      - id: shift-left-stamp
      - id: shift-left-stamp-pre-push
