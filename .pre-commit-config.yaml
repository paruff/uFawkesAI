# Unified Pre-commit Configuration — uFawkes Suite Standard
# This file is the canonical source. Other repos should symlink or copy this.
# Managed by uFawkesAI template; update here, then propagate to suite repos.
#
# Install: pre-commit install --hook-type commit-msg
# Run: pre-commit run --all-files


exclude: |
  ^graphify-out/|^\.opencode/|^\.serena/|^\.agents/logs/|^\.claude/worktrees/

default_stages: [pre-commit]

repos:
  # ============================================================================
  # General Code Quality (Core)
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key

  # ============================================================================
  # Python — Ruff (lint + format, replaces flake8/black/isort)
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        name: Lint Python with Ruff
        args: ["--fix"]
      - id: ruff-format
        name: Format Python with Ruff

  # ============================================================================
  # YAML Linting
  # ============================================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: Lint YAML files
        args: ["-c", ".yamllint"]
        types: [yaml]

  # ============================================================================
  # Markdown Linting
  # ============================================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args: ["--config", ".markdownlint.json", "--fix"]
        exclude: ^CHANGELOG\.md$

  # ============================================================================
  # Security Scanning — Gitleaks (single comprehensive check)
  # ============================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Detect secrets with Gitleaks
        args: ["--config", ".gitleaks.toml"]

  # ============================================================================
  # Shell Linting (shellcheck-py mirror for offline use)
  # ============================================================================
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: Lint shell scripts with shellcheck
        args: ["--severity=warning"]

  # ============================================================================
  # Shell Formatting (shfmt)
  # ============================================================================
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        name: Format shell scripts with shfmt
        args: ["-i", "2", "-ci", "-bn", "-sr", "-w"]
        exclude: '^scripts/buildplatform\.sh$|^.*\.zsh$'

  # ============================================================================
  # Go Code Quality
  # ============================================================================
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint
        name: Lint Go code
        exclude: ^(jenkins-shared-library/|platform/apps-deferred/unleash/examples/)

  # ============================================================================
  # Terraform (for repos with infra/)
  # ============================================================================
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt
        name: Terraform format
        args: ["--args=-recursive"]
      - id: terraform_validate
        name: Terraform validate
        args: ["--hook-config=--retry-once-with-cleanup=true"]
      - id: terraform_tflint
        name: Terraform lint (TFLint)
        args: ["--args=--config=__GIT_WORKING_DIR__/.tflint.hcl"]
      - id: terraform_docs
        name: Terraform docs
        args: ["--args=--config=.terraform-docs.yml"]

  # ============================================================================
  # Kubernetes Manifest Validation
  # ============================================================================
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: insert-license
        name: Insert license header
        files: '\.(yaml|yml|tf)$'
        args:
          - --license-filepath
          - LICENSE
          - --comment-style
          - "#"
        exclude: ^(\.github/|\.pre-commit-config\.yaml|\.yamllint|platform/apps/.*/upstream/)

  # ============================================================================
  # Commit Message Validation (commit-msg stage)
  # ============================================================================
  - repo: local
    hooks:
      - id: conventional-commit
        name: Validate Conventional Commits format
        entry: scripts/commit-msg.sh
        language: script
        stages: [commit-msg]

  # ============================================================================
  # uFawkes Suite Specific Validations
  # ============================================================================
  - repo: local
    hooks:
      # Validate staged *-report.md files against their output contracts
      - id: agent-report-contracts
        name: Agent report contracts
        entry: .agents/hooks/pre-commit-agent.sh
        language: script
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      # DORA capability labels must match the canonical registry
      - id: dora-vocabulary
        name: DORA vocabulary
        entry: scripts/check-dora-vocabulary.sh
        language: script
        stages: [pre-commit]
        files: \.(md|yaml|yml)$
        pass_filenames: false

      # AI_STANCE.md completeness + currency
      - id: ai-stance
        name: AI stance audit
        entry: scripts/check-ai-stance.sh
        language: script
        stages: [pre-commit]
        files: (^|/)AI_STANCE\.md$|^\.agents/skills/ai-stance/
        pass_filenames: false

      # Unit tests (dependency-free offline suites)
      - id: unit-tests
        name: Unit tests (offline suites)
        entry: scripts/run-unit-tests.sh
        language: script
        stages: [pre-commit]
        files: ^(scripts/(test-.*|emit-dora-event|check-secret-detection|check-ai-stance|check-dora-vocabulary|run-unit-tests).*|templates/.*\.py)$
        pass_filenames: false

      # 4 execution-boundary agents must be valid AND dispatchable
      - id: agent-dispatch
        name: Agent dispatch
        entry: scripts/check-agents.sh
        language: script
        stages: [pre-commit]
        files: ^(\.agents/agents/|\.opencode/agents/)
        pass_filenames: false

      # Every harness symlink must resolve
      - id: harness-parity
        name: Harness parity
        entry: scripts/check-harness-parity.sh
        language: script
        stages: [pre-commit]
        files: ^(\.agents/|\.claude/|\.opencode/|\.cursor/|\.github/copilot-instructions\.md|GEMINI\.md|CLAUDE\.md|\.cursorrules)
        pass_filenames: false

      # Kubernetes manifest validation (kubeconform)
      - id: kubeconform
        name: Validate Kubernetes manifests (kubeconform)
        entry: |
          bash -c '
            EXCLUDE_PATTERN="values.*\.yaml|kustomization\.yaml|devfiles/|recording-rules\.yaml|scrape-configs\.yaml|aliases\.yaml|dora\.yml"
            if command -v kubeconform &> /dev/null; then
              find infra/kubernetes platform -name "*.yaml" -o -name "*.yml" 2>/dev/null | grep -vE "$EXCLUDE_PATTERN" | xargs -I {} kubeconform -strict -ignore-missing-schemas {}
            elif command -v kubeval &> /dev/null; then
              find infra/kubernetes platform -name "*.yaml" -o -name "*.yml" 2>/dev/null | grep -vE "$EXCLUDE_PATTERN" | xargs -I {} kubeval --ignore-missing-schemas {}
            else
              echo "⚠️  kubeconform/kubeval not installed, skipping K8s validation"
            fi
          '
        language: system
        pass_filenames: false
        files: '^(infra/kubernetes|platform)/.*\.(yaml|yml)$'

      # Kustomize build validation
      - id: kustomize-validate
        name: Validate Kustomize builds
        entry: |
          bash -c '
            if command -v kustomize &> /dev/null; then
              for dir in $(find infra/kubernetes -name "kustomization.yaml" -exec dirname {} \;); do
                echo "Validating $dir"
                kustomize build "$dir" > /dev/null
              done
            else
              echo "⚠️  kustomize not installed, skipping validation"
            fi
          '
        language: system
        pass_filenames: false
        files: '^infra/kubernetes/.*kustomization\.yaml$'

      # Backstage catalog validation
      - id: backstage-catalog-validate
        name: Validate Backstage catalog files
        entry: |
          bash -c '
            if command -v yq &> /dev/null; then
              find . -name "catalog-info.yaml" -o -name "*.catalog-info.yaml" | xargs -I {} bash -c "yq eval . {} > /dev/null && echo \"✓ {}\""
            else
              echo "⚠️  yq not installed, skipping Backstage catalog validation"
            fi
          '
        language: system
        pass_filenames: false
        files: '(catalog-info|\.catalog-info)\.yaml$'

      # ArgoCD Application validation (render check)
      - id: argocd-validate
        name: Validate ArgoCD applications (render check)
        entry: scripts/render-all-applications.sh
        language: system
        pass_filenames: false
        files: 'platform/apps/.*-application\.yaml$'

      # Helm chart linting
      - id: helm-lint
        name: Lint Helm charts
        entry: |
          bash -c '
            if command -v helm &> /dev/null; then
              for chart in infra/kubernetes/*/Chart.yaml; do
                dir=$(dirname "$chart")
                echo "Linting $dir"
                helm lint "$dir"
              done
            else
              echo "⚠️  helm not installed, skipping chart linting"
            fi
          '
        language: system
        pass_filenames: false
        files: '^infra/kubernetes/.*/Chart\.yaml$'

      # Check for hardcoded secrets in K8s manifests
      - id: check-k8s-secrets
        name: Check for hardcoded secrets in K8s manifests
        entry: |
          bash -c '
            grep -r "kind: Secret" infra/kubernetes/ --include="*.yaml" --include="*.yml" 2>/dev/null \
              | grep -v "stringData: {}" \
              | grep -v "# Example" \
              | grep -v "# Template" \
              && exit 1 || exit 0
          '
        language: system
        pass_filenames: false
        files: '^infra/kubernetes/.*\.(yaml|yml)$'

      # MkDocs validation
      - id: mkdocs-validate
        name: Validate MkDocs configuration
        entry: |
          bash -c '
            if command -v mkdocs &> /dev/null && [ -f mkdocs.yml ]; then
              mkdocs build --verbose --site-dir /tmp/mkdocs-build-test && rm -rf /tmp/mkdocs-build-test
            else
              echo "⚠️  mkdocs not installed or mkdocs.yml not found"
            fi
          '
        language: system
        pass_filenames: false
        files: '^(mkdocs\.yml|docs/.*\.md)$'

      # Requirements pinning check (ADR-034)
      - id: requirements-pin-check
        name: Check requirements pinning (ADR-034)
        entry: |
          bash -c '
            found=0
            for f in "$@"; do
              if grep -nE ">=" "$f" | grep -vE "^\s*#" | grep -vE "python_requires|requires>;python_requires"; then
                echo "⚠️  $f: ADR-034 requires == exact pins. Found >= above."
                found=1
              fi
            done
            echo "⚠️  ADR-034 violations found (see above)" exit $foundexit $found exit 0
          ' --
        language: system
        types: [text]
        files: '(requirements.*\.txt|requirements.*\.in)$'

      # Pre-push validation (safety net)
      - id: pre-push-validation
        name: Pre-push validation
        entry: pre-commit run --all-files
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: monthly
  skip: [terraform_tflint, terraform_tfsec, kustomize-validate, helm-lint, mkdocs-validate, argocd-validate, helm-lint, backstage-catalog-validate]
  submodules: false
