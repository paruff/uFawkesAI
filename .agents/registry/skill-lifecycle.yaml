# Skill Lifecycle Registry
# Canonical source of truth for all uFawkesAI skills.
# Schema: .agents/schema/skill-lifecycle.json
#
# Status values: active, stable, beta, draft, deprecated, experimental
# Version follows semver.
#
# Core loop: Superpowers (brainstorming → writing-plans → executing-plans → verification-before-completion → requesting-code-review)

skills:
  # ============================================
  # Core Pipeline Skills
  # ============================================

  # Retired 2026-09-29: Superpowers (baked into the ufawkes-devsecops-ai
  # image, /opt/agent-skills) is the development methodology. uFawkesAI keeps
  # the report contracts in .agents/assertions/minimal-report.yaml.

  spec:
    status: deprecated
    version: 2.0.0
    replaced_by: superpowers/brainstorming
    deprecation_reason: "Superpowers covers this stage; see .agents/README.md"

  design:
    status: deprecated
    version: 2.0.0
    replaced_by: superpowers/brainstorming
    deprecation_reason: "Superpowers covers this stage; see .agents/README.md"

  plan:
    status: deprecated
    version: 2.0.0
    replaced_by: superpowers/writing-plans
    deprecation_reason: "Superpowers covers this stage; see .agents/README.md"

  test:
    status: deprecated
    version: 2.0.0
    replaced_by: superpowers/test-driven-development
    deprecation_reason: "Superpowers covers this stage; see .agents/README.md"

  build:
    status: deprecated
    version: 2.0.0
    replaced_by: superpowers/executing-plans
    deprecation_reason: "Superpowers covers this stage; see .agents/README.md"

  test-execution:
    status: deprecated
    version: 2.0.0
    replaced_by: superpowers/verification-before-completion
    deprecation_reason: "Superpowers covers this stage; see .agents/README.md"

  review:
    status: deprecated
    version: 2.0.0
    replaced_by: superpowers/requesting-code-review
    deprecation_reason: "Superpowers covers this stage; see .agents/README.md"

  continuous-evals:
    status: beta
    version: 0.1.0
    dependencies: []
    load_trigger: "load continuous-evals skill"
    sub_skills: []

  delivery:
    # Truth fix: this skill has no directory under .agents/skills/, so
    # "status: stable" + "load delivery skill" pointed at nothing. It is a
    # planned skill, not a shipped one.
    status: planned
    version: 1.1.0
    dependencies:
      - build
      - review
    load_trigger: "load delivery skill"
    sub_skills: []
    missing: "no .agents/skills/delivery/ — load_trigger cannot resolve"

