# Skill Lifecycle Registry
# Canonical source of truth for all uFawkesAI skills.
# Schema: .agents/schema/skill-lifecycle.json
#
# Status values: active, stable, beta, draft, deprecated, experimental
# Version follows semver.
#
# Core Pipeline: spec → design → build → test → test-execution → review → delivery

skills:
  # ============================================
  # Core Pipeline Skills
  # ============================================

  spec:
    status: stable
    version: 1.1.0
    dependencies: []
    load_trigger: "load spec skill"
    sub_skills:
      - spec/requirements-extraction
      - spec/acceptance-criteria
      - spec/policy-validation
      - spec/pipeline-policy
      - spec/k8s-policy
      - spec/template-governance

  design:
    status: stable
    version: 1.1.0
    dependencies:
      - spec
    load_trigger: "load design skill"
    sub_skills:
      - design/architecture-decomposition
      - design/component-identification
      - design/interface-definition
      - design/k8s-design-validation

  plan:
    status: stable
    version: 1.1.0
    dependencies:
      - spec
      - design
    load_trigger: "load plan skill"
    sub_skills:
      - plan/task-decomposition
      - plan/dependency-mapping
      - plan/effort-estimation
      - plan/risk-identification
      - plan/skill-matching
      - plan/governance-alignment

  test:
    status: stable
    version: 1.1.0
    dependencies:
      - spec
    load_trigger: "load test skill"
    sub_skills: []

  build:
    status: stable
    version: 1.1.0
    dependencies:
      - design
    load_trigger: "load build skill"
    sub_skills:
      - build/code-generation
      - build/manifest-generation
      - build/pipeline-generation
      - build/gitops-overlay-generation
      - build/governance-enforcement
      - build/template-application
      - build/refactoring

  test-execution:
    status: stable
    version: 1.1.0
    dependencies:
      - build
      - test
    load_trigger: "load test-execution skill"
    sub_skills:
      - test-execution/unit-test-execution
      - test-execution/integration-test-execution
      - test-execution/e2e-test-execution
      - test-execution/test-coverage-validation
      - test-execution/pipeline-test-stage-validation
      - test-execution/runtime-simulation-validation
      - test-execution/performance-smoke-testing

  review:
    status: stable
    version: 2.0.0
    dependencies:
      - build
      - test-execution
    load_trigger: "load review skill"
    sub_skills:
      - review/spec-compliance
      - review/design-compliance
      - review/code-quality
      - review/acceptance-criteria
      - review/security-rbac
      - review/secret-governance
      - review/policy-validation
      - review/k8s-policy
      - review/pipeline-policy
      - review/gitops-overlay
    modes:
      - pr-review
      - build-validation

  delivery:
    status: stable
    version: 1.1.0
    dependencies:
      - build
      - review
    load_trigger: "load delivery skill"
    sub_skills: []

  # ============================================
  # Cross-Cutting Skills
  # ============================================

  observability:
    status: active
    version: 1.0.0
    dependencies: []
    load_trigger: "load observability skill"
    sub_skills: []

  cross-validation:
    status: active
    version: 1.0.0
    dependencies:
      - spec
      - design
      - build
      - test
      - test-execution
      - review
