# Agent Output Contracts
# Each agent's report must satisfy its contract before being considered complete.
# Schema: .agents/assertions/agent-output-schema.json
# Runner: bash .agents/assertions/assertion-runner.sh <report.md> <agent-name>

agents:
  build:
    required_sections:
      - "Build Report"
      - "Tasks Completed"
      - "Artifacts Produced"
      - "Validation Results"
    required_fields:
      status: true
    findings_required_when: never

  design:
    required_sections:
      - "Design:"
      - "Architecture Overview"
      - "Components"
      - "Tradeoffs"
      - "Governance Alignment"
      - "Implementation Sequence"
      - "Verification Strategy"
    findings_required_when: never


  spec:
    required_sections:
      - "Specification:"
      - "Functional Requirements"
      - "Acceptance Criteria"
      - "Governance Alignment"
    findings_required_when: never

  test:
    required_sections: []
    findings_required_when: never
    forbidden_patterns:
      - "expect(true).toBe(true)"
      - 'it("works"'
    required_patterns:
      - "TDD"
      - "test:.*failing"
      - "feat:.*implement"


  cross-validation:
    required_sections:
      - "Cross-Validation Report"
      - "Validation Results"
      - "Findings"
    required_fields:
      decision: true
    findings_required_when: never
    forbidden_patterns:
      - "I think"
      - "probably"
      - "might be"
    required_patterns:
      - "All 4 rules must pass"
      - "pipeline blocked"
