# Agent Output Contracts
# Each agent's report must satisfy its contract before being considered complete.
# Schema: .agents/assertions/agent-output-schema.json
# Runner: bash .agents/assertions/assertion-runner.sh <report.md> <agent-name>

agents:
  build:
    required_sections:
      - "Build Report"
      - "Tasks Completed"
      - "Artifacts Produced"
      - "Validation Results"
    required_fields:
      status: true
    findings_required_when: never

  design:
    required_sections:
      - "Design:"
      - "Architecture Overview"
      - "Components"
      - "Tradeoffs"
      - "Governance Alignment"
    findings_required_when: never

  review:
    # Two modes: PR Review and Build Validation
    # PR Review Mode requires: Review Agent Assessment, Architecture Violations, Test Gaps
    # Build Validation Mode requires: Build Review Report, Spec Compliance, Design Compliance, Acceptance Criteria, Code Quality, Findings
    required_sections:
      - "Review Agent Assessment"
      - "Architecture Violations"
      - "Test Gaps"
    required_fields:
      size_decision: true
    findings_required_when: REQUEST_CHANGES
    forbidden_patterns:
      - "LGTM"
      - "looks good"

  spec:
    required_sections:
      - "Specification:"
      - "Functional Requirements"
      - "Acceptance Criteria"
      - "Governance Alignment"
    findings_required_when: never

  test:
    required_sections: []
    findings_required_when: never
    forbidden_patterns:
      - "expect(true).toBe(true)"
      - 'it("works"'
    required_patterns:
      - "TDD"
      - "test:.*failing"
      - "feat:.*implement"

  test-execution:
    required_sections:
      - "Test Report"
      - "Test Results"
      - "Coverage"
    required_fields:
      decision: true
    findings_required_when: FAIL
    forbidden_patterns:
      - "no tests exist"

  cross-validation:
    required_sections:
      - "Cross-Validation Report"
      - "Validation Results"
      - "Findings"
    required_fields:
      decision: true
    findings_required_when: FAIL
    forbidden_patterns:
      - "I think"
      - "probably"
      - "might be"
    required_patterns:
      - "All 4 rules must pass"
      - "pipeline blocked"
